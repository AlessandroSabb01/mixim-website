<form class="form" action="/api/contact.php" method="post" data-form data-wa="{{whatsapp}}" novalidate>
  <input type="hidden" name="lang" value="{{lang}}">
  <div class="form__row">
    <div class="field">
      <input id="__P__-first" name="nome" type="text" autocomplete="given-name" placeholder=" " required>
      <label for="__P__-first">{{t.booking.firstName}}</label>
    </div>
    <div class="field">
      <input id="__P__-last" name="cognome" type="text" autocomplete="family-name" placeholder=" " required>
      <label for="__P__-last">{{t.booking.lastName}}</label>
    </div>
  </div>
  <div class="form__row">
    <div class="field">
      <input id="__P__-email" name="email" type="email" autocomplete="email" placeholder=" " required>
      <label for="__P__-email">{{t.booking.email}}</label>
    </div>
    <div class="field">
      <input id="__P__-tel" name="telefono" type="tel" autocomplete="tel" inputmode="tel" placeholder=" " required>
      <label for="__P__-tel">{{t.booking.phone}}</label>
    </div>
  </div>
  <div class="form__row">
    <div class="field">
      <select id="__P__-home" name="casa" required>
        <option value="">{{t.booking.homeSelect}}</option>
        <option value="rome">{{t.booking.homeRome}}</option>
        <option value="crete">{{t.booking.homeCrete}}</option>
        <option value="any">{{t.booking.homeAny}}</option>
      </select>
      <label for="__P__-home">{{t.booking.home}}</label>
    </div>
    <div class="field">
      <select id="__P__-guests" name="ospiti" required>
        <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6+">6+</option>
      </select>
      <label for="__P__-guests">{{t.booking.guests}}</label>
    </div>
  </div>
  <div class="form__row">
    <div class="field">
      <input id="__P__-in" name="arrivo" type="date" placeholder=" ">
      <label for="__P__-in">{{t.booking.checkin}}</label>
    </div>
    <div class="field">
      <input id="__P__-out" name="partenza" type="date" placeholder=" ">
      <label for="__P__-out">{{t.booking.checkout}}</label>
    </div>
  </div>
  <div class="field">
    <textarea id="__P__-msg" name="messaggio" rows="3" placeholder=" "></textarea>
    <label for="__P__-msg">{{t.booking.message}}</label>
  </div>
  <div class="hp" aria-hidden="true"><label for="__P__-web">{{t.booking.honeypot}}</label><input id="__P__-web" name="website" type="text" tabindex="-1" autocomplete="off"></div>
  <label class="consent">
    <input type="checkbox" name="privacy" value="1" required>
    <span>{{t.booking.consent}}</span>
  </label>
  <div class="form__status" role="status" aria-live="polite"></div>
  <button type="submit" class="btn btn--solid btn--lg btn--block" data-magnetic>{{t.booking.submit}} {{icon arrow}}</button>
  <p class="form__note">{{t.booking.note}}</p>
</form>
