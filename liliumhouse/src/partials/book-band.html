<section class="section section--tight section--sand" aria-labelledby="bb-title">
  <div class="container book-band">
    <div class="book-band__text">
      <h2 id="bb-title" data-split>{{t.bookBand.title}}</h2>
      <p class="lead" data-reveal>{{t.bookBand.text}}</p>
    </div>
    <div class="book-band__actions" data-reveal>
      <a class="btn btn--wa btn--lg" href="{{waLink}}" target="_blank" rel="noopener" data-magnetic>{{icon whatsapp}} {{t.bookBand.wa}}</a>
      <button type="button" class="btn btn--line btn--lg" data-book="{{bookHome}}">{{icon calendar}} {{t.bookBand.form}}</button>
      <a class="book-band__phone" href="tel:{{phoneHref}}">{{icon phone}} {{phone}}</a>
    </div>
  </div>
</section>
