<header class="site-header" data-theme="{{headerTheme}}">
  <nav class="nav" aria-label="Navigazione principale">
    <a class="nav__logo" href="/" aria-label="Studio Dentistico Giancaspro — Home">
      <img class="logo-blue" src="/assets/img/logo-blue.webp" width="720" height="103" alt="Studio Dentistico Giancaspro">
      <img class="logo-white" src="/assets/img/logo-white-nav.webp" width="720" height="103" alt="" aria-hidden="true">
    </a>
    <ul class="nav__links">{{navLinks}}</ul>
    <div class="nav__actions">
      <a class="btn btn--ghost btn--sm nav__call" href="tel:{{phoneHref}}">{{icon phone}}<span>{{phone}}</span></a>
      <button type="button" class="btn btn--primary btn--sm" data-book data-magnetic><span>Prenota</span><span class="nav__cta-label-long">Consulenza</span></button>
      <button type="button" class="nav__burger" aria-expanded="false" aria-controls="menu" aria-label="Apri il menu"><span></span><span></span><span></span></button>
    </div>
  </nav>
</header>

<div class="menu" id="menu" aria-hidden="true" inert>
  <ul class="menu__list">{{menuLinks}}</ul>
  <div class="menu__foot">
    <div class="menu__quick">
      <a class="btn btn--ghost" href="https://wa.me/{{whatsapp}}" target="_blank" rel="noopener">{{icon whatsapp}} WhatsApp</a>
      <a class="btn btn--ghost" href="{{instagramUrl}}" target="_blank" rel="noopener">{{icon instagram}} Instagram</a>
      <a class="btn btn--ghost" href="{{mapsUrl}}" target="_blank" rel="noopener">{{icon pin}} Maps</a>
    </div>
    <a class="btn btn--primary btn--block" href="tel:{{phoneHref}}">{{icon phone}} Chiama {{phone}}</a>
  </div>
</div>
