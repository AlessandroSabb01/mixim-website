<div class="modal" id="booking" role="dialog" aria-modal="true" aria-labelledby="booking-title" hidden inert>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel" data-lenis-prevent>
    <div class="modal__handle" aria-hidden="true"></div>
    <button type="button" class="modal__close" data-close aria-label="Chiudi">{{icon close}}</button>
    <span class="eyebrow">Prenota Consulenza</span>
    <h2 id="booking-title" style="font-size:clamp(1.8rem,1.3rem + 2vw,2.8rem);margin-top:14px">Richiedi un appuntamento</h2>
    <p class="muted" style="margin-top:10px">Il nostro team è a disposizione per rispondere a ogni domanda e guidarti verso il trattamento più adatto alle tue esigenze.</p>
    <div class="modal__quick">
      <a class="btn btn--primary" href="https://wa.me/{{whatsapp}}" target="_blank" rel="noopener">{{icon whatsapp}} WhatsApp</a>
      <a class="btn btn--ghost" href="tel:{{phoneHref}}">{{icon phone}} Chiama</a>
    </div>
    <div class="modal__divider">oppure</div>
    {{> form:m}}
  </div>
</div>
